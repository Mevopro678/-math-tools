<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Homework Central</title>
    <style>
        body { font-family: sans-serif; background-color: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 5px; font-size: 28px; color: #4CAF50; }
        p { color: #888; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: #222; padding: 25px; border-radius: 10px; cursor: pointer; border: 2px solid #333; transition: 0.2s; }
        .game-card:hover { transform: scale(1.05); border-color: #4CAF50; background: #2a2a2a; }
        .game-title { font-size: 18px; font-weight: bold; color: #fff; }
        /* Interactive full-screen view */
        #player-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 999; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { position: absolute; top: 15px; left: 15px; background: #ff3b30; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>

    <h1>Study Prep Tool Kit</h1>
    <p>Select an assignment dashboard link to launch your testing module.</p>

    <!-- GRID OF 10 UNBLOCKED GAMES -->
    <div class="grid">
        <div class="game-card" onclick="playGame('https://eviltower.io/')">
            <div class="game-title">EvilTower.io (Bloxd)</div>
        </div>
        <div class="game-card" onclick="playGame('https://stickman-unblocked.github.io/')">
            <div class="game-title">Stickman Hook</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Bloxd.io (Main)</div>
        </div>
        <div class="game-card" onclick="playGame('https://konggames.io')">
            <div class="game-title">Retro Bowl</div>
        </div>
        <div class="game-card" onclick="playGame('https://runner3.github.io/')">
            <div class="game-title">Run 3</div>
        </div>
        <div class="game-card" onclick="playGame('https://tunnelrush.github.io/')">
            <div class="game-title">Tunnel Rush</div>
        </div>
        <div class="game-card" onclick="playGame('https://slopegame.github.io/')">
            <div class="game-title">Slope Game</div>
        </div>
        <div class="game-card" onclick="playGame('https://mathadventure1.github.io/sm64/sm64/index.html')">
            <div class="game-title">Super Mario 64</div>
        </div>
        <div class="game-card" onclick="playGame('https://doodlecube.io')">
            <div class="game-title">Doodle Cube</div>
        </div>
        <div class="game-card" onclick="playGame('https://cattn.github.io/gba/')">
            <div class="game-title">GBA Emulator Library</div>
        </div>
    </div>

    <!-- WINDOW PORTAL PLAYER -->
    <div id="player-container">
        <button class="back-btn" onclick="closeGame()">↩ Back to Dashboard</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function playGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('player-container').style.display = 'block';
        }
        function closeGame() {
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }
    </script>
</body>
</html>
