<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Homework Central</title>
    <style>
        body { font-family: sans-serif; background-color: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 30px; font-size: 28px; color: #4CAF50; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .game-card { background: #222; padding: 20px; border-radius: 10px; cursor: pointer; border: 2px solid #333; transition: 0.2s; }
        .game-card:hover { transform: scale(1.05); border-color: #4CAF50; background: #2a2a2a; }
        .game-title { font-size: 18px; font-weight: bold; }
        #player-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 999; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { position: absolute; top: 15px; left: 15px; background: #ff3b30; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Study Prep Tool Kit</h1>

    <div class="grid">
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Stickman Hook</div>
        </div>
        <div class="game-card" onclick="playGame('https://konggames.io')">
            <div class="game-title">Retro Bowl</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Run 3</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Tunnel Rush</div>
        </div>
    </div>

    <div id="player-container">
        <button class="back-btn" onclick="closeGame()">↩ Back to Menu</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function playGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('player-container').style.display = 'block';
        }
        function closeGame() {
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }
    </script>
</body>
</html>
