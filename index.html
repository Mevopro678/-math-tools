<!DOCTYPE html>
<html>
<head>
    <title>My Game Site</title>
    <style>
        body { background-color: white; color: black; font-family: sans-serif; text-align: center; padding-top: 50px; }
        a { display: inline-block; padding: 15px 25px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px;}
    </style>
</head>
<body>
    <h1>Welcome to My Arcade!</h1>
    <p>If you see this white screen, your website is working perfectly!</p>
    
    <!-- This link will open Stickman Hook directly in a new working window -->
    <a href="https://github.io" target="_blank">Click Here to Play Stickman Hook</a>
</body>
</html>
    <div id="player-container">
        <button class="back-btn" onclick="closeGame()">↩ Back to Menu</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function playGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('player-container').style.display = 'block';
        }
        function closeGame() {
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }
    </script>
</body>
</html>
