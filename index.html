<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Homework Central</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: radial-gradient(circle at center, #1a1c24 0%, #0a0b0d 100%);
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 50px 20px; 
            min-height: 100vh;
        }
        h1 { 
            margin-bottom: 5px; 
            font-size: 42px; 
            font-weight: 900;
            background: linear-gradient(45deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p { color: #6a7080; margin-bottom: 50px; font-size: 16px; font-weight: 500; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .game-card { 
            background: #13151c; 
            padding: 40px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            position: relative;
            border: 1px solid #222633;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            text-decoration: none;
            display: block;
        }
        .game-card:nth-child(3n+1) { border-bottom: 4px solid #00ff87; }
        .game-card:nth-child(3n+2) { border-bottom: 4px solid #00f0ff; }
        .game-card:nth-child(3n+3) { border-bottom: 4px solid #ff007f; }
        .game-card:hover { 
            transform: translateY(-12px) scale(1.02); 
            background: #181b24;
        }
        .game-card:nth-child(3n+1):hover { box-shadow: 0 15px 30px rgba(0, 255, 135, 0.25); border-color: #00ff87; }
        .game-card:nth-child(3n+2):hover { box-shadow: 0 15px 30px rgba(0, 240, 255, 0.25); border-color: #00f0ff; }
        .game-card:nth-child(3n+3):hover { box-shadow: 0 15px 30px rgba(255, 0, 127, 0.25); border-color: #ff007f; }
        .game-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <h1>Arcade Dashboard</h1>
    <p>Select a terminal card below to open the unblocked deployment directly.</p>

    <div class="grid">
        <!-- Bypasses firewall by forcing a direct navigation popout instead of a nested iframe -->
        <a class="game-card" href="https://eviltower.io" target="_blank">
            <div class="game-title">EvilTower.io (Bloxd)</div>
        </a>
        <a class="game-card" href="http://stickmanhook.gitlab.io/" target="_blank">
            <div class="game-title">Stickman Hook</div>
        </a>
        <a class="game-card" href="https://retrobowl25unblocked.github.io/" target="_blank">
            <div class="game-title">Retro Bowl</div>
        </a>
        <a class="game-card" href="https://runner3.github.io/" target="_blank">
            <div class="game-title">Run 3</div>
        </a>
        <a class="game-card" href="https://tunnelrush.github.io/" target="_blank">
            <div class="game-title">Tunnel Rush</div>
        </a>
        <a class="game-card" href="https://slopegame.github.io/" target="_blank">
            <div class="game-title">Slope Game</div>
        </a>
        <a class="game-card" href="https://mathadventure1.github.io/sm64/sm64/index.html" target="_blank">
            <div class="game-title">Super Mario 64</div>
        </a>
        <a class="game-card" href="https://doodlecube.io" target="_blank">
            <div class="game-title">Doodle Cube</div>
        </a>
        <a class="game-card" href="https://cattn.github.io/gba/" target="_blank">
            <div class="game-title">GBA Emulator</div>
        </a>
        <a class="game-card" href="https://1v1.lol" target="_blank">
            <div class="game-title">1v1.lol</div>
        </a>
    </div>

</body>
</html>
