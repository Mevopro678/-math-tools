<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Homework Central</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: radial-gradient(circle at center, #1a1c24 0%, #0a0b0d 100%);
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 50px 20px; 
            min-height: 100vh;
        }

        h1 { 
            margin-bottom: 5px; 
            font-size: 42px; 
            font-weight: 900;
            background: linear-gradient(45deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        p { color: #6a7080; margin-bottom: 50px; font-size: 16px; font-weight: 500; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .game-card { 
            background: #13151c; 
            padding: 40px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            position: relative;
            border: 1px solid #222633;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .game-card:nth-child(3n+1) { border-bottom: 4px solid #00ff87; }
        .game-card:nth-child(3n+2) { border-bottom: 4px solid #00f0ff; }
        .game-card:nth-child(3n+3) { border-bottom: 4px solid #ff007f; }

        .game-card:hover { 
            transform: translateY(-12px) scale(1.02); 
            background: #181b24;
        }
        
        .game-card:nth-child(3n+1):hover { box-shadow: 0 15px 30px rgba(0, 255, 135, 0.25); border-color: #00ff87; }
        .game-card:nth-child(3n+2):hover { box-shadow: 0 15px 30px rgba(0, 240, 255, 0.25); border-color: #00f0ff; }
        .game-card:nth-child(3n+3):hover { box-shadow: 0 15px 30px rgba(255, 0, 127, 0.25); border-color: #ff007f; }

        .game-title { 
            font-size: 22px; 
            font-weight: 800; 
            color: #fff; 
            letter-spacing: 0.5px;
        }

        #player-container { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 999; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #ff3b30; color: white; border: none; padding: 12px 24px; font-size: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; z-index: 1000; box-shadow: 0 4px 14px rgba(255, 59, 48, 0.4); transition: 0.2s; }
        .back-btn:hover { transform: scale(1.05); background: #e03228; }
    </style>
</head>
<body>

    <h1>Arcade Dashboard</h1>
    <p>Select a learning simulation terminal to activate.</p>

    <div class="grid">
        <div class="game-card" onclick="playGame('https://gitlab.io')">
            <div class="game-title">Stickman Hook (GitLab)</div>
        </div>
        <div class="game-card" onclick="playGame('https://bloxd.io')">
            <div class="game-title">Bloxd.io / EvilTower</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Retro Bowl</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Run 3</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Tunnel Rush</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Slope Game</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">Super Mario 64</div>
        </div>
        <div class="game-card" onclick="playGame('https://doodlecube.io')">
            <div class="game-title">Doodle Cube</div>
        </div>
        <div class="game-card" onclick="playGame('https://github.io')">
            <div class="game-title">GBA Emulator</div>
        </div>
        <div class="game-card" onclick="playGame('https://1v1.lol')">
            <div class="game-title">1v1.lol</div>
        </div>
    </div>

    <div id="player-container">
        <button class="back-btn" onclick="closeGame()">↩ Back to Dashboard</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function playGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('player-container').style.display = 'block';
        }
        function closeGame() {
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('game-frame').src = '';
        }
    </script>
</body>
</html>
